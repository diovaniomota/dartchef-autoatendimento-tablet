name: next_food_tablet_app
description: "App Flutter para pedidos na mesa integrado ao next-food"
publish_to: 'none'
version: 0.2.6+25

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  wakelock_plus: ^1.0.0
  mobile_scanner: ^6.0.2
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
